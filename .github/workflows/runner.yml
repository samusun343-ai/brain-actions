name: runner-session

on:
  workflow_dispatch:

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Setup SSH daemon (public key only)
        run: |
          set -e
          mkdir -p ~/.ssh
          cat > ~/.ssh/authorized_keys <<'EOF'
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJnMisOT/M1a28Ld2JWdqrft685Kr0G6KfZWEO84f1Em hatch
          EOF
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server >/dev/null
          fi
          sudo ssh-keygen -A
          sudo systemctl stop ssh.service ssh.socket 2>/dev/null || true
          sudo systemctl disable ssh.socket 2>/dev/null || true
          sudo pkill -x sshd 2>/dev/null || true
          sleep 1
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -o Port=2222 -o PasswordAuthentication=no -o PubkeyAuthentication=yes -o ChallengeResponseAuthentication=no
          BANNER=""
          for i in $(seq 1 15); do
            BANNER=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -c 12 <&3' 2>/dev/null || true)
            echo "banner probe $i: $BANNER"
            case "$BANNER" in SSH-*) break;; esac
            sleep 2
          done
          case "$BANNER" in SSH-*) echo "sshd OK";; *) echo "sshd FAILED"; sudo /usr/sbin/sshd -t || true; exit 1;; esac

      - name: Open TCP tunnel (bore) as a systemd unit and self-test end to end
        run: |
          set -e
          BORE_URL=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest | grep -o 'https://[^"]*x86_64-unknown-linux-musl\.tar\.gz' | head -1)
          echo "bore asset: $BORE_URL"
          curl -sL "$BORE_URL" | tar -xz -C /tmp bore
          chmod +x /tmp/bore
          sudo systemd-run --unit=bore-tunnel --collect /bin/bash -c '/tmp/bore local 2222 --to bore.pub > /tmp/bore.log 2>&1'
          EP=""
          for i in $(seq 1 30); do
            EP=$(grep -o 'bore\.pub:[0-9]*' /tmp/bore.log 2>/dev/null | head -1 || true)
            [ -n "$EP" ] && break
            sleep 2
          done
          [ -n "$EP" ] || { echo "tunnel FAILED"; cat /tmp/bore.log; exit 1; }
          BPORT=${EP#bore.pub:}
          BANNER=""
          for i in $(seq 1 20); do
            BANNER=$(timeout 3 bash -c "exec 3<>/dev/tcp/bore.pub/$BPORT; head -c 12 <&3" 2>/dev/null || true)
            echo "e2e banner probe $i: $BANNER"
            case "$BANNER" in SSH-*) break;; esac
            sleep 3
          done
          case "$BANNER" in SSH-*) echo "tunnel e2e OK";; *) echo "tunnel e2e FAILED"; cat /tmp/bore.log; exit 1;; esac
          echo "SSH_ENDPOINT=$EP"
          echo "::notice title=SSH_ENDPOINT::$EP"
          {
            echo "### SSH endpoint"
            echo "$EP"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$EP" > session.txt
          echo "--- runner specs ---"
          nproc
          free -m
          df -h / | tail -1

      - name: Publish session endpoint as artifact
        uses: actions/upload-artifact@v4
        with:
          name: session
          path: session.txt
          retention-days: 1

      - name: Keep alive until timeout
        run: |
          while true; do echo "alive $(date -u +%FT%TZ)"; sleep 300; done
